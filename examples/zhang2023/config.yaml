# The paper's experiment expressed as a pipeline config (Full mode, Lite layered underneath).
# Corpus: Zhang et al. (2023) Stack Overflow threads, rebuilt as of 18 June 2023 (256 surviving posts), in data/.
# Build corpus.csv first (adds the paper's strata):  python3 examples/zhang2023/to_pipeline_csv.py
# For Lite only, use config.lite.yaml. Set up your models first (SETUP.md) and run `council.py doctor`.
# Paths are relative to this folder.

mode: full
workspace: ../../runs/zhang2023

study:
  corpus_csv: corpus.csv
  unit_name: Stack Overflow thread
  unit_name_plural: Stack Overflow threads
  respondent_name: poster
  respondent_name_plural: posters
  corpus_description: >
    Threads that mention GitHub Copilot, each as it stood on 18 June 2023: the title, the question,
    and the answers and comments posted by then, with code blocks shown as `[code]`. Many threads are
    general programming questions in which Copilot comes up in one answer or comment; code only what
    the thread says about Copilot.
  scope_rule: "Code only what a thread says about GitHub Copilot, and only where a poster states it."
  topic_phrase: " about GitHub Copilot"
  # The five questions Zhang et al. answered by constant comparison, verbatim, with their published
  # rationale and data item (Section 3.1, Table 1, Section 3.3.1).
  research_questions:
    - id: RQ1.4
      slug: FU
      text: "What functions are implemented by using GitHub Copilot?"
      rationale: "Copilot can complete entire functions according to users' comments. The question asks for a categorization of the functions implemented with Copilot (data item: functions implemented by Copilot), categorized by what each function does, from developers' descriptions of the functions they mention."
    - id: RQ1.5
      slug: PU
      text: "What are the purposes of using GitHub Copilot?"
      rationale: "Users may use Copilot for different purposes; the question asks what users are using Copilot for (data item: intentions of using Copilot)."
    - id: RQ2.1
      slug: BE
      text: "What are the benefits of using GitHub Copilot?"
      rationale: "Using Copilot to assist programming can bring benefits (e.g., reducing the workload of developers); the question collects the advantages brought to development by applying Copilot (data item: benefits brought by using Copilot)."
    - id: RQ2.2
      slug: LC
      text: "What are the limitations & challenges of using GitHub Copilot?"
      rationale: "There are restrictions and problems when using Copilot; the question collects the limitations and challenges practitioners may experience (data item: restrictions and difficulties when using Copilot)."
    - id: RQ2.3
      slug: EF
      text: "What are the expected features of users about GitHub Copilot?"
      rationale: "There are features Copilot does not provide but users want; the question investigates the features users expect (data item: features that users want Copilot to provide)."

# The experiment's coder brief used these two issue codes.
issue_codes:
  ISSUE_NON_RESPONSE: "The unit has no readable text (empty after code stripping, a bare error dump)."
  ISSUE_OFF_TOPIC: "Nothing the thread says about Copilot bears on any of the five research questions (for example, Copilot is only named in passing)."

roles:
  analysts: {A: claude, B: gpt, C: gemini}
  reconciler: claude                     # addendum A9: Claude reconciles, GPT is the reconciliation adversary
  reconciliation_adversary: gpt
  coders: {"1": claude, "2": gpt, "3": gemini}

models:
  claude: {backend: claude_cli, model: claude-opus-5}
  gpt:
    backend: codex_cli
    model: gpt-5.6-terra                 # whole-corpus roles
    stage_models: {coding: gpt-5.6-sol}  # coder 2 and the GPT coding adversary
  gemini: {backend: gemini_api, model: gemini-3.7-flash, api_key_env: GEMINI_API_KEY}

reasoning:
  default_stages: [discovery, discovery-repair, discovery-answer, reconcile, reconcile-answer]
  reduced_effort: low

decision_model:
  enabled: true
  backend: typesafe
  endpoint: https://api.typesafe.ai/v1/systemone
  model: jev-latest
  api_key_env: TYPESAFE_API_KEY
  state_key: thread                      # the experiment sent {"thread": text}
  include_research_question: false       # and the code's label, definition, include, exclude only

thresholds:
  support_floor: 3
  min_quotes: 3
  consensus: 2
  alpha_drop: 0.67
  alpha_high: 0.80
  grounding_lead_below: 0.5
  omission_lead_at_or_above: 0.8
  screening_tau: 0.10
  screening_top_k: 5
  screening_audit_share: 0.05
  coding_lead_assigned_below: 0.2
  coding_lead_unassigned_at_or_above: 0.8
  max_label_words: 14

batch_size: 25
discovery_block_size: 0
max_repairs: 2
workers: 6

reconciliation:
  groups_per_rq: [5, 15]                 # addendum A8
  run_lite_baseline_in_full: true

splits:
  seed: 20260930
  development_share: 0.25                # 64 development, 192 evaluation
  blind_pass_min: 50
  blind_pass_share: 0.10
  blind_pass_max: 200
  held_out_min: 60
  strata_columns: [stratum]              # tagged github-copilot or not x thread-length tercile

reliability:
  units: evaluation

spot_check:
  random_sample: 50
  seed: 20260930

prices:                                  # USD per million tokens
  claude-opus-5: [5, 25]
  gemini-3.7-flash: [0.75, 3.75]
  gpt-5.6-terra: [2.0, 12.0]
  gpt-5.6-sol: [4.0, 20.0]
  jev-latest: [0.042, 0]

data_governance: "Public Stack Overflow content (CC BY-SA), no participant data; sent to Anthropic (Claude Code), OpenAI (Codex), Google (Gemini API) and TypeSafe (Jev)."
